[project]
name = "falcon-demand-radar"
version = "0.1.0"
description = "Local automation platform for collection, analysis, and operations workflows."
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "httpx",
    "jinja2",
    "python-multipart",
    "uvicorn",
]

[project.scripts]
falcon = "falcon.cli:main"

[tool.setuptools.packages.find]
include = ["falcon*"]
