<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falcon Graphite Sage 页面设计稿</title>
  <style>
    :root {
      --bg: #202823;
      --panel: #2b342f;
      --panel-2: #323d36;
      --ink: #eef2eb;
      --muted: #aeb8ad;
      --line: rgba(190, 208, 188, 0.18);
      --accent: #9fbd8f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #26302a 0%, var(--bg) 52%, #1e2622 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    main {
      width: min(1380px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .pill {
      border: 1px solid rgba(159, 189, 143, 0.32);
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--accent);
      background: rgba(159, 189, 143, 0.08);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    article {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(50, 61, 54, 0.96), rgba(43, 52, 47, 0.96));
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
    }

    article h2 {
      margin: 0;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 16px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel-2);
    }

    @media (max-width: 900px) {
      main {
        width: min(100vw - 28px, 720px);
        padding-top: 24px;
      }

      header {
        display: block;
      }

      .pill {
        display: inline-block;
        margin-top: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Falcon Graphite Sage 页面设计稿</h1>
        <p>所有截图来自真实路由和现有模板，用于核对组件完整性与整体 UI 风格。</p>
      </div>
      <span class="pill">12 个页面</span>
    </header>

    <section class="grid">
      <article><a href="01-dashboard.png"><h2>01 仪表盘</h2><img src="01-dashboard.png" alt="仪表盘"></a></article>
      <article><a href="02-report.png"><h2>02 日报</h2><img src="02-report.png" alt="日报"></a></article>
      <article><a href="03-keywords.png"><h2>03 关键词池</h2><img src="03-keywords.png" alt="关键词池"></a></article>
      <article><a href="04-collector-overview.png"><h2>04 采集总览</h2><img src="04-collector-overview.png" alt="采集总览"></a></article>
      <article><a href="05-collector-environment.png"><h2>05 环境自检</h2><img src="05-collector-environment.png" alt="环境自检"></a></article>
      <article><a href="06-collector-accounts.png"><h2>06 账号管理</h2><img src="06-collector-accounts.png" alt="账号管理"></a></article>
      <article><a href="07-collector-run-detail.png"><h2>07 任务详情</h2><img src="07-collector-run-detail.png" alt="任务详情"></a></article>
      <article><a href="08-collector-sample-preview.png"><h2>08 样本预览</h2><img src="08-collector-sample-preview.png" alt="样本预览"></a></article>
      <article><a href="09-analysis.png"><h2>09 分析总览</h2><img src="09-analysis.png" alt="分析总览"></a></article>
      <article><a href="10-execution.png"><h2>10 执行总览</h2><img src="10-execution.png" alt="执行总览"></a></article>
      <article><a href="11-review.png"><h2>11 人工复核</h2><img src="11-review.png" alt="人工复核"></a></article>
      <article><a href="12-tasks.png"><h2>12 触达任务</h2><img src="12-tasks.png" alt="触达任务"></a></article>
    </section>
  </main>
</body>
</html>
