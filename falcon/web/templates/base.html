<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Falcon 控制台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">F</span>
      <div>
        <strong>Falcon</strong>
        <small>Agent</small>
      </div>
    </div>
    <nav class="nav-groups">
      <section class="nav-group">
        <h2>采集</h2>
        <a class="{{ 'active' if active == 'collector' else '' }}" href="/collector">采集总览</a>
        <a class="{{ 'active' if active == 'collector_create' else '' }}" href="/collector/create">创建任务</a>
        {% if current_run %}
        <a class="{{ 'active' if active == 'collector_run' else '' }}" href="/collector/runs/{{ current_run.run_id }}">任务详情</a>
        {% endif %}
      </section>
      <section class="nav-group">
        <h2>分析</h2>
        <a class="{{ 'active' if active == 'analysis' else '' }}" href="/analysis">分析总览</a>
      </section>
      <section class="nav-group">
        <h2>执行</h2>
        <a class="{{ 'active' if active == 'execution' else '' }}" href="/execution">执行总览</a>
      </section>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
