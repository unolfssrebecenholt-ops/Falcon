<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Falcon 控制台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">F</span>
      <div>
        <strong>Falcon</strong>
        <small>Agent</small>
      </div>
    </div>
    <nav>
      <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/">总览</a>
      <a class="{{ 'active' if active == 'keywords' else '' }}" href="/keywords">关键词池</a>
      <a class="{{ 'active' if active == 'review' else '' }}" href="/review">人工复核</a>
      <a class="{{ 'active' if active == 'tasks' else '' }}" href="/tasks">触达任务</a>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
