{% extends "base.html" %}
{% block title %}设置 - Falcon{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <div class="eyebrow">local settings</div>
    <h1>设置</h1>
    <p>集中管理 Falcon 的采集基础资料、日报阅读和本机模型中转配置。</p>
  </div>
</header>

<section class="settings-directory" aria-label="设置目录">
  <div class="settings-card-grid">
    {% for card in settings_cards %}
    <a class="settings-card" href="{{ card.href }}">
      <span class="settings-card-code">{{ card.code }}</span>
      <strong>{{ card.title }}</strong>
      <p>{{ card.summary }}</p>
      <span class="settings-card-foot">
        <span>{{ card.meta }}</span>
        <span>{{ card.action }}</span>
      </span>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
