{% extends "base.html" %}
{% block title %}任务创建 - Falcon{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <div class="eyebrow">collector create</div>
    <h1>任务创建</h1>
    <p>独立表单页按平台、账号、关键词和采样范围分组；默认使用截图保存版，低频执行，不下载原图。</p>
  </div>
  <div class="action-row">
    <a class="button" href="/collector/runs">返回队列</a>
  </div>
</header>

<div class="collector-create-layout">
  {% include "collector_create_form.html" %}
</div>

<script>
(() => {
  const createForm = document.getElementById("collector-create-form");
  const keywordTags = document.getElementById("keyword-tags");
  const keywordInput = document.getElementById("keyword-input");
  const keywordAdd = document.getElementById("keyword-add");
  const keywordsHidden = document.getElementById("keywords-hidden");
  const keywordCountChip = document.getElementById("keyword-count-chip");
  const profileSelect = document.getElementById("profile-select");
  const platformInputs = Array.from(document.querySelectorAll('input[name="platform"]'));
  const maxPostsInput = document.querySelector('input[name="max_posts"]');
  const maxCommentsInput = document.querySelector('input[name="max_comments_per_post"]');
  const confirmDialog = document.getElementById("collector-create-confirm-dialog");
  const confirmPlatform = document.getElementById("confirm-platform");
  const confirmProfile = document.getElementById("confirm-profile");
  const confirmKeywords = document.getElementById("confirm-keywords");
  const confirmRunCount = document.getElementById("confirm-run-count");
  const confirmMaxPosts = document.getElementById("confirm-max-posts");
  const confirmMaxComments = document.getElementById("confirm-max-comments");
  const confirmCancel = document.getElementById("confirm-create-cancel");
  const confirmSubmit = document.getElementById("confirm-create-submit");
  let confirmedSubmit = false;

  function getKeywords() {
    return Array.from(keywordTags?.querySelectorAll(".keyword-chip") || [])
      .map((chip) => chip.dataset.keyword || chip.firstChild?.textContent?.trim())
      .filter(Boolean);
  }

  function updateKeywordSummary() {
    const keywords = getKeywords();
    const count = keywords.length;
    if (keywordsHidden) keywordsHidden.value = keywords.join("\n");
    if (keywordCountChip) keywordCountChip.textContent = `${count} 个关键词`;
  }

  function createKeywordChip(keyword) {
    const chip = document.createElement("span");
    chip.className = "keyword-chip";
    chip.dataset.keyword = keyword;
    chip.append(document.createTextNode(`${keyword} `));
    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.setAttribute("aria-label", `移除 ${keyword}`);
    removeButton.textContent = "×";
    removeButton.addEventListener("click", () => {
      chip.remove();
      updateKeywordSummary();
    });
    chip.append(removeButton);
    return chip;
  }

  function addKeywordsFromInput() {
    if (!keywordInput || !keywordTags) return;
    const existing = new Set(getKeywords());
    const values = keywordInput.value.split(/[,，\n]/).map((value) => value.trim()).filter(Boolean);
    values.forEach((keyword) => {
      if (!existing.has(keyword)) {
        keywordTags.append(createKeywordChip(keyword));
        existing.add(keyword);
      }
    });
    keywordInput.value = "";
    keywordInput.setCustomValidity("");
    updateKeywordSummary();
  }

  function selectedPlatformLabel() {
    const selected = platformInputs.find((input) => input.checked);
    const platformName = selected?.closest(".option-card")?.querySelector("strong")?.firstChild?.textContent?.trim();
    return selected ? `${platformName || "小红书"} / ${selected.value}` : "未选择";
  }

  function populateConfirmDialog() {
    const keywords = getKeywords();
    if (confirmPlatform) confirmPlatform.textContent = selectedPlatformLabel();
    if (confirmProfile) confirmProfile.textContent = profileSelect?.value || "未选择";
    if (confirmKeywords) confirmKeywords.textContent = keywords.join(" / ");
    if (confirmRunCount) confirmRunCount.textContent = `${keywords.length} 个`;
    if (confirmMaxPosts) confirmMaxPosts.textContent = maxPostsInput?.value || "8";
    if (confirmMaxComments) confirmMaxComments.textContent = maxCommentsInput?.value || "5";
  }

  function openConfirmDialog() {
    populateConfirmDialog();
    if (confirmDialog?.showModal) {
      confirmDialog.showModal();
    } else {
      confirmDialog?.setAttribute("open", "");
    }
  }

  function closeConfirmDialog() {
    if (confirmDialog?.close) {
      confirmDialog.close();
    } else {
      confirmDialog?.removeAttribute("open");
    }
  }

  keywordAdd?.addEventListener("click", addKeywordsFromInput);
  keywordInput?.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === "," || event.key === "，") {
      event.preventDefault();
      addKeywordsFromInput();
    }
  });
  keywordInput?.addEventListener("input", () => keywordInput.setCustomValidity(""));
  confirmCancel?.addEventListener("click", () => {
    confirmedSubmit = false;
    closeConfirmDialog();
  });
  confirmSubmit?.addEventListener("click", () => {
    confirmedSubmit = true;
    closeConfirmDialog();
    if (createForm?.requestSubmit) {
      createForm.requestSubmit();
    } else {
      createForm?.submit();
    }
  });
  createForm?.addEventListener("submit", (event) => {
    if (confirmedSubmit) return;
    event.preventDefault();
    addKeywordsFromInput();
    if (!getKeywords().length) {
      keywordInput?.setCustomValidity("请先添加至少一个关键词");
      keywordInput?.reportValidity();
      keywordInput?.focus();
      return;
    }
    openConfirmDialog();
  });
  updateKeywordSummary();
})();
</script>
{% endblock %}
